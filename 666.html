<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海航 666 冬季航线查询</title>
<style>
:root {
  --primary: #1a6e3c;
  --primary-light: #e8f5ec;
  --accent: #c8391a;
  --accent-light: #fff3ee;
  --bg: #f5f7fa;
  --card: #ffffff;
  --border: #dde3ec;
  --text: #1a2332;
  --text-muted: #6b7a8d;
  --badge-beijing: #1565c0;
  --badge-tianjin: #2e7d32;
  --badge-shijiazhuang: #6a1b9a;
  --badge-jinan: #ef6c00;
  --trip-out: #1565c0;
  --trip-back: #c62828;
  --p1-color: #b71c1c;
  --p1-bg: #ffebee;
  --p1-border: #ef9a9a;
  --p2-color: #37474f;
  --p2-bg: #f5f5f5;
  --p2-border: #cfd8dc;
  --far-color: #bf360c;
  --far-bg: #fff3e0;
  --far-border: #ffb74d;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  background: var(--primary);
  color: white;
  padding: 20px 32px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}

header h1 {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 4px;
}

header p {
  font-size: 0.82rem;
  opacity: 0.85;
}

.legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 0.78rem;
  color: var(--text-muted);
  padding: 8px 32px;
  background: white;
  border-bottom: 1px solid var(--border);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.city-tabs button {
  flex-shrink: 0;
  white-space: nowrap;
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.legend-dot.beijing { background: var(--badge-beijing); }
.legend-dot.tianjin { background: var(--badge-tianjin); }
.legend-dot.sjz { background: var(--badge-shijiazhuang); }
.legend-dot.jinan { background: var(--badge-jinan); }

.legend-p1 {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--p1-bg);
  border: 1px solid var(--p1-border);
  border-radius: 12px;
  padding: 1px 8px;
  color: var(--p1-color);
  font-weight: 600;
  font-size: 0.72rem;
}

.legend-p2 {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--p2-bg);
  border: 1px solid var(--p2-border);
  border-radius: 12px;
  padding: 1px 8px;
  color: var(--p2-color);
  font-weight: 600;
  font-size: 0.72rem;
}

/* Controls */
.controls {
  background: white;
  padding: 12px 32px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: flex-start;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 76px;
  z-index: 99;
}

.controls-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.filter-label {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 700;
  white-space: nowrap;
  min-width: 28px;
}

.filter-divider {
  width: 1px;
  height: 24px;
  background: var(--border);
  margin: 0 4px;
}

.filter-btn {
  padding: 5px 13px;
  border: 1.5px solid var(--border);
  border-radius: 16px;
  background: white;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.18s;
  color: var(--text);
  white-space: nowrap;
}

.filter-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.filter-btn.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

/* P1 / P2 filter pills */
.filter-p1-btn {
  border-color: var(--p1-border);
  color: var(--p1-color);
  background: var(--p1-bg);
  font-size: 0.78rem;
  font-weight: 600;
}

.filter-p1-btn:hover {
  border-color: var(--p1-color);
  background: #fce4ec;
}

.filter-p1-btn.active {
  background: var(--p1-color);
  border-color: var(--p1-color);
  color: white;
}

.filter-p2-btn {
  border-color: var(--p2-border);
  color: var(--p2-color);
  background: var(--p2-bg);
}

.filter-p2-btn:hover {
  border-color: #90a4ae;
}

.filter-p2-btn.active {
  background: var(--p2-color);
  border-color: var(--p2-color);
  color: white;
}

.trip-toggle {
  display: flex;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
}

.trip-toggle-btn {
  padding: 6px 16px;
  border: none;
  background: white;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-muted);
  transition: all 0.18s;
}

.trip-toggle-btn.active-out {
  background: var(--trip-out);
  color: white;
}

.trip-toggle-btn.active-back {
  background: var(--trip-back);
  color: white;
}

.trip-toggle-btn + .trip-toggle-btn {
  border-left: 1px solid var(--border);
}

/* P-level badge on province buttons */
.province-btn-wrap {
  position: relative;
  display: inline-block;
}

.p-badge {
  position: absolute;
  top: -5px;
  right: -5px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.55rem;
  font-weight: 800;
  color: white;
  line-height: 1;
  z-index: 2;
}

.p-badge.p1 { background: var(--p1-color); }
.p-badge.p2 { background: #78909c; }

/* Stats bar */
.stats-bar {
  background: var(--primary-light);
  padding: 8px 32px;
  font-size: 0.8rem;
  color: var(--primary);
  display: flex;
  gap: 24px;
  border-bottom: 1px solid #c8e6d5;
}

/* Main container */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 16px;
}

/* Trip section */
.trip-section {
  margin-bottom: 40px;
}

.trip-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border);
}

.trip-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 4px;
  font-weight: 700;
  font-size: 0.85rem;
  color: white;
}

.trip-badge.out { background: var(--trip-out); }
.trip-badge.back { background: var(--trip-back); }

.trip-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
}

/* City tabs */
.city-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 16px;
  border-bottom: 2px solid var(--border);
}

.city-tab {
  padding: 10px 18px;
  cursor: pointer;
  font-size: 0.85rem;
  border: none;
  background: none;
  color: var(--text-muted);
  font-weight: 600;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: all 0.18s;
  border-radius: 6px 6px 0 0;
}

.city-tab:hover { color: var(--primary); background: var(--primary-light); }

.city-tab.active {
  color: white;
  background: var(--primary);
  border-bottom-color: var(--primary);
}

.city-tab .count {
  display: inline-block;
  background: rgba(0,0,0,0.1);
  color: inherit;
  font-size: 0.7rem;
  padding: 1px 6px;
  border-radius: 10px;
  margin-left: 4px;
}

/* Cards grid */
.dept-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: box-shadow 0.2s;
}

.card:hover {
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  transform: translateY(-1px);
}

.card.p1-card {
  border-color: var(--p1-border);
}

.card.p1-card .card-header {
  background: var(--p1-bg);
  border-bottom-color: var(--p1-border);
}

.card.p2-card {
  border-color: var(--p2-border);
  opacity: 0.85;
}

.card-header {
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}

.card-city {
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}

.p-level-tag {
  font-size: 0.65rem;
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 8px;
  color: white;
}

.p-level-tag.p1 { background: var(--p1-color); }
.p-level-tag.p2 { background: #78909c; }

.distance-tag {
  font-size: 0.6rem;
  font-weight: 800;
  padding: 1px 5px;
  border-radius: 8px;
  color: white;
  flex-shrink: 0;
  letter-spacing: 0.02em;
}
.distance-tag.far { background: var(--far-color); }
.distance-tag.near { background: #90a4ae; }

.card.far-card {
  border-color: var(--far-border) !important;
  background: var(--far-bg) !important;
}
.card.far-card .card-header { background: #fff8ee !important; border-bottom-color: var(--far-border); }
.card.far-card:hover { box-shadow: 0 4px 20px rgba(191, 54, 12, 0.15); }

.card-province {
  font-size: 0.73rem;
  color: var(--text-muted);
}

.flight-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-bottom: 1px solid #f0f2f5;
  padding: 10px 14px;
  align-items: start;
}

.flight-row:last-child { border-bottom: none; }

.flight-col {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.flight-col:first-child {
  border-right: 1px solid #f0f2f5;
  padding-right: 12px;
}

.flight-col:last-child {
  padding-left: 12px;
}

.flight-item {
  background: #f8f9fb;
  border-radius: 6px;
  padding: 5px 8px;
  margin-bottom: 3px;
  border-left: 3px solid var(--primary);
}

.flight-item.shijiazhuang {
  border-left-color: var(--badge-shijiazhuang);
}

.flight-item.jinan {
  border-left-color: var(--badge-jinan);
}

.flight-item .flight-no {
  font-weight: 700;
  font-size: 0.8rem;
  color: var(--text);
}

.flight-item .flight-time {
  font-size: 0.76rem;
  color: var(--text-muted);
}

.flight-item .flight-day {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 1px;
}

.no-flights {
  padding: 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.85rem;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

/* City dot colors */
.dot-beijing { background: var(--badge-beijing); }
.dot-tianjin { background: var(--badge-tianjin); }
.dot-shijiazhuang { background: var(--badge-shijiazhuang); }
.dot-jinan { background: var(--badge-jinan); }
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

.highlight { background: rgba(255, 235, 59, 0.4); }

/* Province section label */
.province-section-label {
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 6px 0 4px;
  margin-bottom: 4px;
}

.province-section-label.p1-label { color: var(--p1-color); }
.province-section-label.p2-label { color: var(--p2-color); }

@media (max-width: 600px) {
  .controls { padding: 10px 16px; top: 72px; }
  .dept-cards { grid-template-columns: 1fr; }
  header { padding: 14px 16px; }
}

@media (max-width: 700px) {
  #main-container > div { flex-direction: column; }
}
</style>
</head>

  <div style="margin-left:auto;font-size:0.78rem;color:var(--text-muted);align-self:center;" id="result-count"></div>
</div>

<div class="stats-bar" id="stats-bar">

</div>

<div class="container" id="main-container">

</div>

// ==================== COMPUTE P1/P2 ====================
// Determine P-level: P1 = has both 去程 AND 回程 for this province
function computePLevels() {
  const provOut = new Set();
  const provBack = new Set();
  RAW.forEach(r => {
    const prov = r[0];
    if (r[2] === '去程') provOut.add(prov);
    if (r[2] === '回程') provBack.add(prov);
  });
  const p1 = [];
  const p2 = [];
  const allProvs = [...new Set([...provOut, ...provBack])];
  allProvs.forEach(p => {
    if (provOut.has(p) && provBack.has(p)) p1.push(p);
    else p2.push(p);
  });
  return { p1, p2 };
}

const { p1: P1_PROVS, p2: P2_PROVS } = computePLevels();

const FAR_THRESHOLD = 800;

function getCityDist(city) {
  return DIST[city] || [0, 0, 0, 0];
}

function cityMaxDist(city) {
  const d = getCityDist(city);
  return Math.max(d[0], d[1], d[2], d[3]);
}

function cityFarLabel(city, airportKey) {
  // airportKey: 3=Beijing, 4=Tianjin, 5=Shijiazhuang, 6=Jinan
  const idx = airportKey === 3 ? 0 : airportKey === 4 ? 1 : airportKey === 5 ? 2 : 3;
  const d = getCityDist(city)[idx] || 0;
  if (d === 0) return '';
  const isFar = d >= FAR_THRESHOLD;
  return { label: isFar ? `${d}km` : `${d}km`, far: isFar, km: d };
}

// First destination city per province (for distance sorting)
const PROV_FIRST_CITY = {};
const SEEN_PROV = [];
RAW.forEach(r => {
  if (!PROV_FIRST_CITY[r[0]]) PROV_FIRST_CITY[r[0]] = r[1];
  if (!SEEN_PROV.includes(r[0])) SEEN_PROV.push(r[0]);
});

// ==================== INIT ====================
function init() {
  buildProvinceButtons();
  doFilter();
}

function buildProvinceButtons() {
  const p1Container = document.getElementById('p1-buttons');
  const p2Container = document.getElementById('p2-buttons');

  // Sort P1/P2 provinces by distance from outCity (default Beijing if null)
  const sortByDist = (provs) => {
    const idx = outCity === 4 ? 1 : outCity === 5 ? 2 : outCity === 6 ? 3 : 0; // Beijing(0) / Tianjin(1) / SJZ(2) / Jinan(3)
    return [...provs].sort((a, b) => {
      const cityA = PROV_FIRST_CITY[a];
      const cityB = PROV_FIRST_CITY[b];
    const dA = cityA ? (DIST[cityA] || [0,0,0,0])[idx] : 0;
    const dB = cityB ? (DIST[cityB] || [0,0,0,0])[idx] : 0;
      return dB - dA;
    });
  };

  let p1List = P1_PROVS;
  let p2List = P2_PROVS;
  if (nightOut || nightBack) {
    const eveningProvs = getEveningProvinceSet();
    p1List = P1_PROVS.filter(p => eveningProvs.has(p));
    p2List = P2_PROVS.filter(p => eveningProvs.has(p));
  }

  const sortedP1 = sortByDist(p1List);
  const sortedP2 = sortByDist(p2List);

  // P1 row
  p1Container.innerHTML = '';
  p1Container.appendChild(makeBtn('全部', '全部', activeProvince === '全部' && activeLevel === 'p1', 'p1'));
  sortedP1.forEach(prov => {
    p1Container.appendChild(makeBtn(prov, prov, activeProvince === prov, 'p1'));
  });

  // P2 row
  p2Container.innerHTML = '';
  if (sortedP2.length > 0) {
    document.getElementById('p2-filter-row').style.display = '';
    p2Container.appendChild(makeBtn('全部', '全部', activeProvince === '全部' && activeLevel === 'p2', 'p2'));
    sortedP2.forEach(prov => {
      p2Container.appendChild(makeBtn(prov, prov, activeProvince === prov, 'p2'));
    });
  } else {
    document.getElementById('p2-filter-row').style.display = 'none';
  }
}

function makeBtn(text, value, active, level) {
  const btn = document.createElement('button');
  btn.className = `filter-btn filter-${level}-btn${active ? ' active' : ''}`;
  btn.textContent = text;
  btn.onclick = () => setProvince(value, level, btn);
  return btn;
}

function setProvince(prov, level, btn) {
  // Only one province active at a time across both levels
  activeProvince = prov;
  activeLevel = level;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));

  // If "全部", only activate the "全部" of the clicked level
  // If a specific province, activate its button
  btn.classList.add('active');
  doFilter();
}

// ==================== FILTER ====================
function doFilter() {
  searchText = document.getElementById('search-input').value.trim().toLowerCase();
  render();
}

function matchesSearch(text) {
  if (!searchText) return true;
  return text.toLowerCase().includes(searchText);
}

function isEveningFlight(flightStr) {
  const parsed = parseFlight(flightStr);
  if (!parsed) return false;
  return parsed.depart >= '20:00';
}

function rowHasEveningFlight(r) {
  for (let i = 3; i <= 6; i++) {
    const t = r[i];
    if (!t || t === '-') continue;
    if (t.split('\n').filter(f => f.trim()).some(isEveningFlight)) return true;
  }
  return false;
}

function getEveningDirectionSet(tripType) {
  const set = new Set();
  RAW.forEach(r => {
    if (r[2] !== tripType) return;
    if (rowHasEveningFlight(r)) set.add(r[0]);
  });
  return set;
}

function getEveningProvinceSet() {
  const out = nightOut ? getEveningDirectionSet('去程') : new Set();
  const back = nightBack ? getEveningDirectionSet('回程') : new Set();

  if (nightOut && nightBack) {
    const both = new Set();
    out.forEach(p => { if (back.has(p)) both.add(p); });
    return both;
  }
  return nightOut ? out : back;
}

function updateNightFilter() {
  nightOut = document.getElementById('night-out-filter').checked;
  nightBack = document.getElementById('night-back-filter').checked;
  if ((nightOut || nightBack) && activeProvince !== '全部') {
    const eveningProvs = getEveningProvinceSet();
    if (!eveningProvs.has(activeProvince)) {
      activeProvince = '全部';
    }
  }
  buildProvinceButtons();
  doFilter();
}

// ==================== RENDER ====================
function render() {
  const container = document.getElementById('main-container');
  const statsBar = document.getElementById('stats-bar');
  container.innerHTML = '';

  const eveningProvs = (nightOut || nightBack) ? getEveningProvinceSet() : null;

  const ALL_CITIES = [
    { key: 3, name: '北京首都·大兴', dotClass: 'dot-beijing' },
    { key: 4, name: '天津',          dotClass: 'dot-tianjin' },
    { key: 5, name: '石家庄',        dotClass: 'dot-shijiazhuang' },
    { key: 6, name: '济南',          dotClass: 'dot-jinan' }
  ];

  // --- Two-column layout ---
  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'display:flex;gap:16px;max-width:1200px;margin:0 auto;';

  // Helper: render a column
  function renderCol(tripType, colBg, accentColor) {
    const section = document.createElement('div');
    section.style.cssText = `flex:1;min-width:0;background:${colBg};border-radius:12px;overflow:hidden;`;

    // Column title bar
    const titleBar = document.createElement('div');
    titleBar.style.cssText = `background:${accentColor};color:white;padding:10px 16px;font-weight:700;font-size:0.95rem;display:flex;align-items:center;gap:8px;`;
    titleBar.innerHTML = tripType === '去程'
      ? `<span style="font-size:1.1rem;">🛫</span> 去程航班（出发 → 目的地）`
      : `<span style="font-size:1.1rem;">🛬</span> 回程航班（目的地 → 出发）`;
    section.appendChild(titleBar);

    // City tabs: always show all 4 + "全部"
    // outCity/backCity = null means "全部"
    const myCity = tripType === '去程' ? outCity : backCity;
    const setMyCity = (key) => {
      if (tripType === '去程') { outCity = key; buildProvinceButtons(); }
      else { backCity = key; }
      render();
    };

    const tabsWrap = document.createElement('div');
    tabsWrap.className = 'city-tabs';
    tabsWrap.style.cssText = 'background:#fff;display:flex;overflow-x:auto;border-bottom:2px solid var(--border);';

    const allTab = document.createElement('button');
    allTab.style.cssText = myCity === null
      ? 'padding:10px 16px;cursor:pointer;font-size:0.84rem;border:none;background:var(--primary);color:white;font-weight:700;border-bottom:3px solid var(--primary);border-radius:6px 6px 0 0;'
      : 'padding:10px 16px;cursor:pointer;font-size:0.84rem;border:none;background:none;color:var(--text-muted);font-weight:600;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;';
    allTab.textContent = '全部';
    allTab.onclick = () => setMyCity(null);
    tabsWrap.appendChild(allTab);

    ALL_CITIES.forEach(city => {
      const tab = document.createElement('button');
      tab.style.cssText = myCity === city.key
        ? 'padding:10px 16px;cursor:pointer;font-size:0.84rem;border:none;background:var(--primary);color:white;font-weight:700;border-bottom:3px solid var(--primary);border-radius:6px 6px 0 0;'
        : 'padding:10px 16px;cursor:pointer;font-size:0.84rem;border:none;background:none;color:var(--text-muted);font-weight:600;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;';
      tab.textContent = city.name;
      tab.onclick = () => setMyCity(city.key);
      tabsWrap.appendChild(tab);
    });
    section.appendChild(tabsWrap);

    // Cards
    const cardsDiv = document.createElement('div');
    cardsDiv.style.cssText = 'padding:16px;display:flex;flex-direction:column;gap:12px;';

    // Determine which city keys to show
    const cityKeys = myCity !== null ? [myCity] : ALL_CITIES.map(c => c.key);

    let colTotal = 0, colFar = 0;

    cityKeys.forEach(cityKey => {
      const cityInfo = ALL_CITIES.find(c => c.key === cityKey);

      const rows = RAW.filter(r => r[2] === tripType && r[cityKey] && r[cityKey] !== '-');
      const destCards = [];
      rows.forEach(r => {
        const prov = r[0], dest = r[1];
        const applyNight = (tripType === '去程' && nightOut) || (tripType === '回程' && nightBack);
        let text = r[cityKey];
        if (applyNight) {
          if (!eveningProvs.has(prov)) return;
          text = text.split('\n').filter(f => f.trim()).filter(isEveningFlight).join('\n');
          if (!text) return;
        }
        if (!text || !text.trim()) return;
        if (!matchesSearch(dest) && !matchesSearch(text)) return;
        if (activeProvince !== '全部') {
          if (prov !== activeProvince) return;
        } else if (activeLevel === 'p1') {
          if (!P1_PROVS.includes(prov)) return;
        } else if (activeLevel === 'p2') {
          if (!P2_PROVS.includes(prov)) return;
        }
        destCards.push({ prov, dest, text, cityKey });
      });

      if (destCards.length === 0) return;

      // Section divider with city name (only if showing all cities)
      if (myCity === null) {
        const div = document.createElement('div');
        div.style.cssText = 'font-size:0.72rem;font-weight:700;color:var(--text-muted);padding:4px 0 2px;letter-spacing:0.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px;';
        div.innerHTML = `<span class="dot ${cityInfo.dotClass}" style="width:8px;height:8px;border-radius:50%;"></span>${cityInfo.name} 出发`;
        cardsDiv.appendChild(div);
      }

      // Sort: far first, then by distance desc
      destCards.sort((a, b) => {
        const fa = cityFarLabel(a.dest, cityKey).far ? 1 : 0;
        const fb = cityFarLabel(b.dest, cityKey).far ? 1 : 0;
        if (fb !== fa) return fb - fa;
        return cityMaxDist(b.dest) - cityMaxDist(a.dest);
      });

      destCards.forEach(item => {
        const prov = item.prov;
        const destCity = item.dest;
        const isP1 = P1_PROVS.includes(prov);
        const distInfo = cityFarLabel(destCity, cityKey);
        const isFar = distInfo.far;
        colTotal++;
        if (isFar) colFar++;

        const card = document.createElement('div');
        const cardBg = isFar ? 'var(--far-bg)' : isP1 ? 'var(--p1-bg)' : 'white';
        const cardBorder = isFar ? 'var(--far-border)' : isP1 ? 'var(--p1-border)' : 'var(--border)';
        card.style.cssText = `background:${cardBg};border:1.5px solid ${cardBorder};border-radius:10px;overflow:hidden;`;

        const hdr = document.createElement('div');
        hdr.style.cssText = `padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid ${cardBorder};background:${isFar ? '#fff8ee' : isP1 ? '#fff0f0' : '#f8f9fb'};`;
        const badgeLabel = isFar ? `${distInfo.km}km` : isP1 ? 'P1' : 'P2';
        const badgeColor = isFar ? 'var(--far-color)' : isP1 ? 'var(--p1-color)' : '#78909c';
        hdr.innerHTML = `
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span class="dot ${cityInfo.dotClass}" style="width:8px;height:8px;border-radius:50%;flex-shrink:0;"></span>
            <span style="font-weight:700;font-size:0.9rem;">${destCity}</span>
            <span style="font-size:0.63rem;font-weight:800;padding:1px 5px;border-radius:8px;color:white;background:${badgeColor};">${badgeLabel}</span>
            ${isFar && isP1 ? `<span style="font-size:0.63rem;font-weight:800;padding:1px 5px;border-radius:8px;color:white;background:${badgeColor};">P1</span>` : ''}
          </div>
          <div style="font-size:0.7rem;color:var(--text-muted);text-align:right;"><div style="font-weight:600;">${prov}</div></div>
        `;
        card.appendChild(hdr);

        const body = document.createElement('div');
        body.style.cssText = 'padding:10px 14px;';
        item.text.split('\n').filter(f => f.trim()).forEach(flight => {
          const parsed = parseFlight(flight);
          const fi = document.createElement('div');
          fi.style.cssText = 'background:#f8f9fb;border-radius:6px;padding:5px 8px;margin-bottom:3px;border-left:3px solid var(--primary);';
          if (cityKey === 5) fi.style.borderLeftColor = 'var(--badge-shijiazhuang)';
          if (cityKey === 6) fi.style.borderLeftColor = 'var(--badge-jinan)';
          if (parsed) {
            fi.innerHTML = `<div style="font-weight:700;font-size:0.8rem;">${parsed.prefix ? parsed.prefix + ' ' : ''}${parsed.flightNo}</div><div style="font-size:0.76rem;color:var(--text-muted);">${parsed.depart} → ${parsed.arrive}</div><div style="font-size:0.7rem;color:var(--text-muted);">${parsed.day}</div>`;
          } else {
            fi.innerHTML = `<div style="font-weight:700;font-size:0.8rem;">${flight}</div>`;
          }
          body.appendChild(fi);
        });
        card.appendChild(body);
        cardsDiv.appendChild(card);
      });
    });

    if (colTotal === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'padding:40px 20px;text-align:center;color:var(--text-muted);font-size:0.85rem;';
      empty.innerHTML = '<div style="font-size:2.5rem;margin-bottom:8px;">📭</div>暂无航班数据';
      cardsDiv.appendChild(empty);
    }

    section.appendChild(cardsDiv);
    return { section, total: colTotal, far: colFar };
  }

  const { section: outSec, total: outTotal, far: outFar } = renderCol('去程', 'var(--primary-light)', 'var(--trip-out)');
  wrapper.appendChild(outSec);

  const { section: backSec, total: backTotal, far: backFar } = renderCol('回程', 'var(--accent-light)', 'var(--trip-back)');
  wrapper.appendChild(backSec);

  container.appendChild(wrapper);

  // Stats bar
  const totalFlights = outTotal + backTotal;
  const totalFar = outFar + backFar;
  statsBar.innerHTML = `
    <span style="color:var(--trip-out);font-weight:700;">🛫 去程 <strong>${outTotal}</strong> 条</span>
    <span style="color:var(--trip-back);font-weight:700;">🛬 回程 <strong>${backTotal}</strong> 条</span>
    <span style="color:var(--far-color);font-weight:700;">🔥 800km+ <strong>${totalFar}</strong> 条</span>
    <span>🚀 P1: <strong>${P1_PROVS.length}</strong> 省 · 📍 P2: <strong>${P2_PROVS.length}</strong> 省</span>
  `;

  document.getElementById('result-count').textContent = `共 ${totalFlights} 条`;

  if (totalFlights === 0) {
    container.innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--text-muted);">
        <div style="font-size:3rem;margin-bottom:12px;">🔍</div>
        <p style="font-size:0.95rem;margin-bottom:6px;">未找到匹配的航线</p>
        <p style="font-size:0.82rem;">试试调整筛选条件</p>
      </div>`;
  }
}

function parseFlight(flightStr) {
  const m = flightStr.match(/^(?:([^:：]+)[:：]\s*)?([A-Za-z0-9]+)\s+(\d{2}:\d{2})-(\d{2}:\d{2})\(([^)]+)\)/);
  if (!m) return null;
  return { prefix: m[1] ? m[1].trim() : '', flightNo: m[2], depart: m[3], arrive: m[4], day: m[5] };
}

init();
</script>
</body>
</html>
